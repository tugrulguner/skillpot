name: Website
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Official image includes browsers and OS dependencies: no runner APT mirror access.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --init --shm-size=1g
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Check canonical repository sources with deployment's Python
        working-directory: .
        run: |
          uv venv --managed-python --python 3.12 "$RUNNER_TEMP/skillpot-source"
          "$RUNNER_TEMP/skillpot-source/bin/python" -c 'import ssl; print(ssl.OPENSSL_VERSION)'
          uv pip install --python "$RUNNER_TEMP/skillpot-source/bin/python" -r requirements-dev.txt
          "$RUNNER_TEMP/skillpot-source/bin/python" scripts/check_docs.py
          "$RUNNER_TEMP/skillpot-source/bin/python" scripts/check_project_skills.py
          "$RUNNER_TEMP/skillpot-source/bin/python" -m unittest discover -s tests -v
      - run: npm ci
      - run: npm run build
      - run: npm run test:browser
      - name: Retain browser screenshots and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: skillpot-browser-${{ github.run_attempt }}
          path: website/test-results/
          if-no-files-found: ignore
          retention-days: 7
