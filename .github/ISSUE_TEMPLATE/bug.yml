name: Bug report
description: Report a reproducible SkillPot defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Help keep SkillPot instructions reproducible and inspectable. Do not include secrets or private instructions.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the selected skill, collection revision, project-relative layout and exact steps. Distinguish setup from product execution.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or deployment
      placeholder: Commit SHA or public URL
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Host name/version and relevant product or browser environment, without secrets or personal paths.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Redacted errors, failing tests or screenshots. Do not attach raw agent traces or private source.
