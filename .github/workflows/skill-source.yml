name: Skill source checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check authored documents and source contract
        run: |
          python3 --version
          python3 scripts/check_docs.py
          python3 -m unittest discover -s tests -v
          git diff --check
