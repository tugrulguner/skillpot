version: 2
updates:
  - package-ecosystem: npm
    directory: /website
    # TypeScript major upgrades require a coordinated Astro checker migration.
    # Current @astrojs/check 0.9.4 requires TS 5; even 0.9.12 supports only TS 5/6.
    # Keep minor/patch proposals; review majors manually against actual peer support.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
