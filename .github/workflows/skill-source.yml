name: Skill source checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Check authored documents and source contract
        run: |
          python3 --version
          python3 -m venv "$RUNNER_TEMP/skillpot-check-env"
          "$RUNNER_TEMP/skillpot-check-env/bin/python" -m pip install -r requirements-dev.txt
          "$RUNNER_TEMP/skillpot-check-env/bin/python" scripts/check_docs.py
          "$RUNNER_TEMP/skillpot-check-env/bin/python" scripts/check_project_skills.py
          "$RUNNER_TEMP/skillpot-check-env/bin/python" -m unittest discover -s tests -v
          git diff --check HEAD^ HEAD
